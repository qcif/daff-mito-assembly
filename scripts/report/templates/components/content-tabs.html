<!-- Four reader-perspective tabs (spec §6a.2, task 46 §4): Overview,
     Validation, Assembly, Barcodes — not one tab per pipeline stage.
     Overview is tab 0 and opens by default (principle-7 guarantee).
     Pane markup is driven by `tab_templates`, built server-side from
     the same ordered `tab_names` list the button strip iterates, so
     the two cannot drift out of sync (task 46 §4). -->
{% from "macros/subjective.html" import render_subjective_input %}

<ul class="nav nav-tabs my-5" id="mainTabs" role="tablist">
  {% for tab in tab_names %}
  <li class="nav-item" role="presentation">
    <button class="nav-link{{ ' active' if loop.first }}"
      id="tab-{{ loop.index0 }}-btn" data-bs-toggle="tab"
      data-bs-target="#tab-{{ loop.index0 }}" type="button" role="tab"
      aria-controls="tab-{{ loop.index0 }}"
      aria-selected="{{ 'true' if loop.first else 'false' }}">
      {{ loop.index }}. {{ tab }}
    </button>
  </li>
  {% endfor %}
</ul>

<div class="tab-content my-3 py-3" id="mainTabsContent">
  {% for tab in tab_names %}
  <div class="tab-pane fade{{ ' show active' if loop.first }}"
    id="tab-{{ loop.index0 }}" role="tabpanel"
    aria-labelledby="tab-{{ loop.index0 }}-btn">
    {% include tab_templates[loop.index0] %}
    {{ render_subjective_input(loop.index0) }}
  </div>
  {% endfor %}
</div>
