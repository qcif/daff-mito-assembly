{% from "macros/subjective.html" import render_subjective_input %}

<ul class="nav nav-tabs mt-5 mb-3" id="mainTabs" role="tablist">
  {% for tab in tab_names %}
  <li class="nav-item" role="presentation">
    <button class="nav-link{{ ' active' if loop.first }}"
      id="tab-{{ loop.index0 }}-btn" data-bs-toggle="tab"
      data-bs-target="#tab-{{ loop.index0 }}" type="button" role="tab"
      aria-controls="tab-{{ loop.index0 }}"
      aria-selected="{{ 'true' if loop.first else 'false' }}">
      {{ loop.index }}. {{ tab }}
    </button>
  </li>
  {% endfor %}
</ul>

<div class="tab-content" id="mainTabsContent">
  {% for tab in tab_names %}
  <div class="tab-pane fade{{ ' show active' if loop.first }}"
    id="tab-{{ loop.index0 }}" role="tabpanel"
    aria-labelledby="tab-{{ loop.index0 }}-btn">
    {% include tab_templates[loop.index0] %}
    {{ render_subjective_input(loop.index0) }}
  </div>
  {% endfor %}
</div>
