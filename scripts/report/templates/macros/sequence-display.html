{% macro render_view_sequence_button(title, sequence, content='View') %}

<button
  class="btn btn-sm btn-primary my-1"
  data-title="{{ title }}"
  data-sequence="{{ sequence }}"
  title="View sequence"
  data-bs-toggle="tooltip"
  data-bs-placement="left"
  onclick="displaySequenceModal(this)"
>
  {{ content }}
</button>

{% endmacro %}

{% macro render_download_sequence_button(header, filename, sequence) %}

<button
  type="button"
  class="btn btn-sm btn-outline-secondary my-1"
  data-header="{{ header }}"
  data-filename="{{ filename }}"
  data-sequence="{{ sequence }}"
  aria-label="Download {{ header }} as FASTA"
  data-bs-toggle="tooltip"
  data-bs-placement="left"
  data-bs-title="Download as FASTA"
  onclick="downloadSequenceAsFasta(this)"
><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" style="width: 1.2rem"><!--!Font Awesome Free - download icon --><path d="M288 32c0-17.7-14.3-32-32-32s-32 14.3-32 32l0 242.7-73.4-73.4c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3l128 128c12.5 12.5 32.8 12.5 45.3 0l128-128c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0L288 274.7 288 32zM64 352c-35.3 0-64 28.7-64 64l0 64c0 35.3 28.7 64 64 64l384 0c35.3 0 64-28.7 64-64l0-64c0-35.3-28.7-64-64-64l-101.5 0-45.3 45.3c-25 25-65.5 25-90.5 0L165.5 352 64 352zm368 56a24 24 0 1 1 0 48 24 24 0 1 1 0-48z"/></svg></button>

{% endmacro %}
