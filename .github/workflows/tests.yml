name: Tests

on:
  push:
  pull_request:

jobs:
  lint:
    name: Nextflow lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nextflow
        uses: nf-core/setup-nextflow@v2
        with:
          version: '25.04.0'

      - name: Lint pipeline
        run: nextflow run . --help || true   # placeholder until nf-core scaffold
        # TODO: replace with `nf-core lint` once nf-core scaffold is in place

      - name: Container-coverage check
        # Every process in modules/local/ must resolve to a container in containers.config.
        # Fail if any process is missing a withName entry.
        run: |
          python3 - <<'EOF'
          import re, sys
          from pathlib import Path

          module_names = {
              p.stem.upper().replace('_', '_')
              for p in Path('modules/local').glob('*.nf')
          }
          containers_text = Path('conf/containers.config').read_text()
          missing = []
          for name in module_names:
              if name not in containers_text:
                  missing.append(name)
          if missing:
              print(f"ERROR: No container entry for: {', '.join(sorted(missing))}", file=sys.stderr)
              sys.exit(1)
          print(f"Container coverage OK ({len(module_names)} processes)")
          EOF

      - name: Directory-output placeholder check
        # Azure blob storage has no empty directories (spec/01 §1a). A
        # directory output must be written into with a `.keep` by script and
        # stub, or be on the allow-list with a reason.
        run: |
          python3 - <<'EOF2'
          import re, sys
          from pathlib import Path

          ALLOW = {
              'nanoplot_raw': 'NanoPlot always writes its report',
              'nanoplot_clean': 'NanoPlot always writes its report',
              'plastid_isoforms': 'optional; absent unless C4 writes files',
              'diagnostics': 'optional; created only when it has content',
          }
          issues = []
          n = 0
          for nf in sorted(Path('modules/local').glob('*.nf')):
              text = nf.read_text()
              if 'output:' not in text or 'script:' not in text:
                  continue
              outputs = text.split('output:', 1)[1].split('script:', 1)[0]
              body = text[text.index('script:'):]
              for m in re.finditer(r'\bpath\("([^"*$.]+?)/?"\)', outputs):
                  name = m.group(1)
                  n += 1
                  if name in ALLOW:
                      continue
                  parts = body.split('stub:')
                  if len(parts) != 2 or any(
                          f'{name}/.keep' not in part for part in parts):
                      issues.append(
                          f"{nf}: directory output '{name}' needs "
                          f"`touch {name}/.keep` in script and stub, "
                          "or an ALLOW entry")
          if issues:
              for i in issues:
                  print(f"ERROR: {i}", file=sys.stderr)
              sys.exit(1)
          print(f"Directory-output check OK ({n} outputs)")
          EOF2

      - name: No-latest-tag check
        run: |
          if grep -rn "container = '.*:latest'" conf/containers.config; then
            echo "ERROR: 'latest' tag found in containers.config" >&2
            exit 1
          fi
          echo "No latest tags found"

      - name: Bare-params file check
        # Fail on ${params.x} or file(params.x) inside script blocks: file
        # params must arrive as `input: path` (CONSTITUTION rule 13).
        # Allows scalar params (params.polish, params.seqtk_seed, etc).
        run: |
          python3 - <<'EOF'
          import re, sys
          from pathlib import Path

          # Scalar params that legitimately appear bare in script blocks
          SCALAR_PARAMS = {
              'polish', 'seqtk_seed', 'min_read_length', 'min_mean_q',
              'filtlong_keep_percent', 'outdir', 'publish_intermediates',
              'cpus', 'memory', 'task', 'barcode_partial_min_nt',
          }

          issues = []
          bare_pat = re.compile(r'\$\{?params\.(\w+)\}?')
          file_pat = re.compile(r'file\(params\.(\w+)\)')

          for nf in Path('modules/local').glob('*.nf'):
              in_script = False
              for lineno, line in enumerate(nf.read_text().splitlines(), 1):
                  if re.match(r'\s*(script|stub)\s*:', line):
                      in_script = True
                  if in_script:
                      for m in file_pat.finditer(line):
                          issues.append(f"{nf}:{lineno}: file(params.{m.group(1)}) in script — pass it as an `input: path`")
                      for m in bare_pat.finditer(line):
                          pname = m.group(1)
                          if pname in SCALAR_PARAMS:
                              continue
                          issues.append(f"{nf}:{lineno}: bare params.{pname} — pass it as an `input: path` or add to SCALAR_PARAMS")

          if issues:
              for i in issues:
                  print(f"ERROR: {i}", file=sys.stderr)
              sys.exit(1)
          print("Bare-params check OK")
          EOF

  python-tests:
    name: Python unit tests (pytest, 100% branch) + flake8
    runs-on: ubuntu-latest
    env:
      COVERAGE_FAIL_UNDER: 100
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install flake8 flake8-bugbear

      - name: flake8
        run: flake8 scripts/ bin/ --exclude=scripts/report/static/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: scripts
          file: scripts/Dockerfile
          build-args: TEST=1
          tags: neoformit/daff-wf5-scripts:test
          push: false
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Unit tests (pytest, fail under 100% branch coverage)
        run: bash scripts/pytest.sh

  nextflow-test:
    name: Nextflow stub end-to-end
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4

      - name: Install Nextflow
        uses: nf-core/setup-nextflow@v2
        with:
          version: '25.04.0'

      - name: Run stub pipeline
        run: nextflow run . -profile stub -stub-run --outdir tests/output

      - name: Verify output layout
        run: |
          python3 - <<'EOF'
          import sys
          from pathlib import Path

          outdir = Path('tests/output')
          errors = []

          for sample_id in ['STUB-01', 'STUB-02']:
              sample_dir = outdir / sample_id
              for fname in ['metadata.json', 'report.html']:
                  p = sample_dir / fname
                  if not p.exists():
                      errors.append(f"Missing: {p}")

          for fname in ['run_manifest.json', 'run-report.html']:
              p = outdir / fname
              if not p.exists():
                  errors.append(f"Missing: {p}")

          if errors:
              for e in errors:
                  print(f"ERROR: {e}", file=sys.stderr)
              sys.exit(1)
          print("Output layout OK")
          EOF

      - name: Failure injection — FILTLONG fails inside a pipe
        run: |
          rm -rf tests/output_inject
          nextflow run . -profile stub -stub-run \
              --outdir tests/output_inject \
              -c tests/stub/inject_filtlong_failure.config \
              > tests/inject_console.log 2>&1
          nextflow log last -f name,status > tests/inject_tasks.tsv
          python3 - <<'EOF'
          import sys
          from pathlib import Path

          errors = []
          console = Path('tests/inject_console.log').read_text()
          for needle in [
              'WF5 TASK FAILED (ignored): FILTLONG (STUB-02)',
              'Error: duplicate read name: INJECTED',
          ]:
              if needle not in console:
                  errors.append(f'Console output lacks: {needle}')

          by_name = {}
          for line in Path('tests/inject_tasks.tsv').read_text().splitlines():
              name, _, status = line.rpartition('\t')
              by_name[name] = status
          if by_name.get('FILTLONG (STUB-02)') != 'FAILED':
              errors.append('FILTLONG (STUB-02) was not FAILED')
          for name in by_name:
              if name.endswith('(STUB-02)') and name not in (
                  'PARSE_SAMPLESHEET (STUB-02)',
                  'NANOPLOT_RAW (STUB-02)',
                  'CHOPPER (STUB-02)',
                  'FILTLONG (STUB-02)',
              ):
                  errors.append(f'Downstream task ran for STUB-02: {name}')
          if by_name.get('COLLATE (STUB-01)') != 'COMPLETED':
              errors.append('Sibling STUB-01 did not complete')

          out = Path('tests/output_inject')
          if (out / 'STUB-02' / 'metadata.json').exists():
              errors.append('STUB-02 unexpectedly has metadata.json')
          import json
          manifest = json.loads((out / 'run_manifest.json').read_text())
          statuses = {
              s['sample_id']: s['sample_status']
              for s in manifest['samples']
          }
          if statuses != {'STUB-01': 'ok', 'STUB-02': 'error'}:
              errors.append(f'Unexpected manifest statuses: {statuses}')
          if not (out / 'STUB-01' / 'metadata.json').exists():
              errors.append('STUB-01 lacks metadata.json')
          logs = out / 'errors' / 'FILTLONG'
          for ext in ('out', 'err', 'log'):
              if not (logs / f'STUB-02.{ext}').exists():
                  errors.append(f'Missing errors/FILTLONG/STUB-02.{ext}')
          if 'INJECTED' not in (logs / 'STUB-02.err').read_text():
              errors.append('STUB-02.err lacks the injected error')
          if [p.name for p in (out / 'errors').iterdir()] != ['FILTLONG']:
              errors.append('errors/ holds logs of non-failed tasks')

          if errors:
              for e in errors:
                  print(f'ERROR: {e}', file=sys.stderr)
              sys.exit(1)
          print('Failure injection OK')
          EOF

      - name: Failure injection — QC-only stage, mixed branches, total loss
        # NANOPLOT_RAW fails for STUB-02 (QC unavailable, sample kept);
        # the same with the two samples on different gate branches (no
        # right-only join leak); and every sample failing at NANOPLOT_RAW
        # and CHOPPER (run report still produced, all samples `error`).
        run: |
          for pair in \
              nanoplot:inject_nanoplot_failure \
              mixed:inject_mixed_branches \
              all_fail:inject_all_fail; do
            case="${pair%%:*}"
            rm -rf "tests/output_${case}"
            nextflow run . -profile stub -stub-run \
                --outdir "tests/output_${case}" \
                -c "tests/stub/${pair#*:}.config" \
                > "tests/${case}_console.log" 2>&1
            nextflow log last -f name,status > "tests/${case}_tasks.tsv"
            python3 tests/stub/check_injection.py "${case}" \
                "tests/output_${case}" "tests/${case}_console.log" \
                "tests/${case}_tasks.tsv"
          done

      - name: Upload Nextflow failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nextflow-failure-diagnostics
          path: |
            .nextflow.log
            work/**/.command.{sh,run,out,err,log,exitcode}
          if-no-files-found: ignore
          retention-days: 7
