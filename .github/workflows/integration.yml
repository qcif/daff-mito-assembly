name: Integration tests

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'main.nf'
      - 'modules/local/**'
      - 'conf/**'
      - 'bin/**'
      - 'tests/integration/**'

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install Nextflow
        uses: nf-core/setup-nextflow@v2
        with:
          version: '25.04.0'

      - name: Fetch integration fixtures
        run: bash tests/integration/fetch_fixtures.sh

      - name: Fetch refdata bundle
        # TODO: cache with actions/cache keyed on refs/v*.sha256
        run: bash scripts/fetch_refs.sh v2026.08_1

      - name: Run pipeline
        run: nextflow run . -profile integration --outdir tests/integration/output

      - name: Assertions
        run: bash tests/integration/assertions.sh

      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-outputs
          path: tests/integration/output/
          retention-days: 7

      - name: Dump annotator log
        if: failure()
        run: |
          for log in tests/integration/output/*/annotation/mitos.log; do
              [[ -f "$log" ]] || continue
              echo "::group::$log"
              cat "$log"
              echo "::endgroup::"
          done

      - name: Upload Nextflow failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-nextflow-diagnostics
          # .command.* and .nextflow.log are dotfiles, and upload-artifact
          # skips hidden files unless told otherwise. Brace expansion is
          # not supported by the action's globber — list each pattern.
          include-hidden-files: true
          path: |
            .nextflow.log
            work/**/.command.sh
            work/**/.command.out
            work/**/.command.err
            work/**/.command.log
            work/**/.exitcode
          if-no-files-found: ignore
          retention-days: 7
